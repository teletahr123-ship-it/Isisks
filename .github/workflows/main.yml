name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unzip project
        run: unzip -q BilliardsOverlay.zip
      - name: Build
        working-directory: BilliardsOverlay
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp BilliardsOverlay/app/build/outputs/apk/debug/app-debug.apk BilliardsOverlay.apk
          gh release create "build-${{ github.run_number }}" BilliardsOverlay.apk --title "Build ${{ github.run_number }}" --notes "Debug APK"
